name: DOC Cross-Reference

on:
  schedule:
    - cron: '0 14 * * *'  # 6am PST (14:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  doc-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run DOC cross-reference
        run: node doc-check.js

      - name: Copy data to frontend public
        run: |
          mkdir -p frontend/public/data
          cp data/*.json frontend/public/data/

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: doc cross-reference update [skip ci]"
          git pull --no-rebase -X ours
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
